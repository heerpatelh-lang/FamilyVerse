nation with 2 players stationed at the near/back posts and 1 speedy forward hovering at the edge of the box.",explanation:"Placing players on the posts protects the vulnerable corners of the goal against deflected headers. Leaving a pacy forward outside the box forces the opponent to leave at least one defender back or risk an instant empty-net counter-attack.",rubric:{criteria:"Tactical soundness, awareness of empty-net risk, post protection",fullPointsCondition:"Mentions post-coverage, protecting the six-yard box, or keeping a counter-outlet to deter the goalkeeper.",partialPointsCondition:"Recommends crowding everyone in the goal-line without an outlet structure.",fullPoints:50},tacticalTip:"Never leave the near post unguarded on late-game inswinging corners.",verificationStatus:"Verified Curated AI",source:"Curated FIFA Coaching Tactical Manual & AI Football Engine"},{id:"fb-02",gameId:"football",title:"The Offside Trap Dilemma",category:"Tactical Scenarios",difficulty:"hard",promptText:"The opposing team has two lightning-fast wingers and an attacking midfielder who plays pinpoint through-balls. Your defenders want to step up to play an aggressive offside trap. As team captain, what is your tactical directive?",revealedAnswer:"Reject the high offside trap; drop the defensive line deeper into a mid-block to eliminate space behind your backline.",explanation:"Playing a high offside trap against elite speed and precision passers is dangerous—one mistimed step gives away a 1-on-1 break. Compacting the space between goalkeeper and backline neutralizes raw sprint speed.",rubric:{criteria:"Countering high-speed wingers and pinpoint passers",fullPointsCondition:"Explains that dropping deeper denies sprint space behind the defensive line.",partialPointsCondition:"Suggests pressing the midfielder without addressing the backline depth.",fullPoints:50},tacticalTip:"Pace is beaten by depth and anticipation, not by gambling on marginal offside calls.",verificationStatus:"Verified Curated AI",source:"Curated UEFA Tactical Studies & AI Football Engine"},{id:"fb-03",gameId:"football",title:"The Origin of the Penalty Kick",category:"Football Trivia",difficulty:"easy",promptText:"In what year and in which country was the penalty kick originally invented to punish intentional fouls near the goal line?",revealedAnswer:"1890 in Ireland (invented by goalkeeper William McCrum; adopted into official rules in 1891).",explanation:'William McCrum, a goalkeeper from County Armagh in Ireland, proposed the rule to prevent deliberate fouls preventing certain goals. It was initially dubbed "the Irishman’s kick".',rubric:{criteria:"Historical accuracy (Year ~1890/1891 or Ireland/UK)",fullPointsCondition:"Identifies Ireland or mentions the 1890s / William McCrum.",partialPointsCondition:"Guesses Britain or the late 19th century without exact details.",fullPoints:50},verificationStatus:"Verified Curated AI",source:"International Football Association Board (IFAB) Archives"},{id:"fb-04",gameId:"football",title:"World Cup Clean Sheet Wonder",category:"Football Trivia",difficulty:"medium",promptText:"Which nation holds the record for conceding ZERO goals during an entire FIFA World Cup tournament, yet got eliminated before the semi-finals?",revealedAnswer:"Switzerland (2006 FIFA World Cup in Germany).",explanation:"Switzerland played four matches without conceding a single goal in open play or extra time, but was eliminated in the Round of 16 after a penalty shootout against Ukraine.",rubric:{criteria:"Historical World Cup trivia accuracy",fullPointsCondition:"Correctly names Switzerland.",partialPointsCondition:"Names a team from the 2006 tournament (e.g., Italy, France).",fullPoints:50},verificationStatus:"Verified Curated AI",source:"FIFA World Cup Historical Statistics & Curated AI Sports Dataset"},{id:"fb-05",gameId:"football",title:"Breaking the Low Block",category:"Tactical Scenarios",difficulty:"medium",promptText:'Your team has 75% possession, but the opponent is parked in a dense 5-4-1 "low block" defending inside their own 18-yard box. Direct central passes keep getting intercepted. How do you unlock this defense?',revealedAnswer:"Overload wide areas, switch play rapidly, and utilize third-man cutbacks or deliver low diagonal crosses between defenders and the goalkeeper.",explanation:"Central compactness can only be stretched horizontally. Quick switches of play draw defensive lines apart, creating half-spaces for overlapping full-backs to send pull-back crosses.",rubric:{criteria:"Recognizing horizontal stretching, wing overloads, or cutback crosses",fullPointsCondition:"Proposes fast wide switches, half-space overloads, or cutbacks to draw out compact defenders.",partialPointsCondition:"Recommends just shooting from long distance repeatedly.",fullPoints:50},tacticalTip:"You cannot play through a wall; you must move the wall side-to-side.",verificationStatus:"Verified Curated AI",source:"Modern Tactical Playbook & Curated AI Sports Dataset"},{id:"fb-06",gameId:"football",title:"Bonus Mission: Blind Spot Header Challenge",category:"Bonus Mission",difficulty:"hard",promptText:'Bonus Mission! Both teammates must stand up and physically demonstrate: One player acts as the corner taker and mimics an inswinger, while the other demonstrates "attacking the blind side of the center-back" with an explosive header motion! The host decides form!',revealedAnswer:"Successful team coordination and physical demonstration of a darting blind-side header run.",explanation:"A blind-side run starts behind the defender’s back shoulder, so the defender cannot see both the ball and the attacker simultaneously.",rubric:{criteria:"Enthusiastic physical demonstration, correct blind-side positioning",fullPointsCondition:"Both players perform the corner routine with clear blind-side movement.",partialPointsCondition:"Hesitant or stationary demonstration.",fullPoints:75},verificationStatus:"Verified Curated AI",source:"Interactive Family Games Protocol & AI Football Engine"},{id:"fb-07",gameId:"football",title:"The Golden Goal Sudden Death",category:"Tie-Breaker",difficulty:"hard",promptText:"TIE-BREAKER! Minute 119. A penalty shootout looms, but you win a free kick 28 yards out directly in front of goal. The wall has 5 tall players jumping. What is the highest percentage strike?",revealedAnswer:"A driven low strike under the jumping wall OR an inswinging curler dipping into the top corner opposite the goalkeeper’s weight.",explanation:"When a wall is instructed to jump aggressively, shooting low under their boots has a high probability of finding the target if struck cleanly, famously demonstrated by Ronaldinho and Messi.",rubric:{criteria:"Tactical awareness of wall mechanics",fullPointsCondition:"Identifies shooting low underneath the jumping wall or dipping curler to the keeper’s blind side.",partialPointsCondition:"Suggests blasting straight into the wall.",fullPoints:100},verificationStatus:"Verified Curated AI",source:"Championship Moments Archive & AI Football Engine"},{id:"fb-08",gameId:"football",title:"The Goalkeeper Pass-Back Rule",category:"Football Trivia",difficulty:"easy",promptText:"In 1992, FIFA revolutionized modern football with a major rule change regarding the goalkeeper. What were goalkeepers forbidden from doing?",revealedAnswer:"Handling intentional back-passes kicked by their own teammates.",explanation:"The back-pass rule stopped teams from wasting time by constantly rolling the ball back into the goalkeeper’s hands, dramatically speeding up modern football.",rubric:{criteria:"Knowledge of the 1992 back-pass rule",fullPointsCondition:"Mentions touching/handling back-passes with hands.",partialPointsCondition:"Mentions passing to the keeper without specifying hand usage.",fullPoints:50},verificationStatus:"Verified Curated AI",source:"IFAB Rule History & Curated AI Sports Dataset"},{id:"fb-09",gameId:"football",title:"Pressing Trigger Identification",category:"Tactical Scenarios",difficulty:"medium",promptText:'Your team employs a high-energy pressing style. What is the single best "pressing trigger" that signals your entire frontline to sprint forward together and trap the opponent?',revealedAnswer:"When an opposing defender receives the ball facing their own goal, takes a heavy touch, or receives an aerial bobbling pass.",explanation:"When a defender faces backward or takes a poor touch, their field of vision and passing angles are severely restricted, making an aggressive press overwhelmingly successful.",rubric:{criteria:"Identifying restricted vision or poor ball control triggers",fullPointsCondition:"Names receiving with back to goal, heavy touch, or weak slow pass.",partialPointsCondition:'Says "whenever the opponent has the ball".',fullPoints:50},verificationStatus:"Verified Curated AI",source:"High-Press Coaching Systems & AI Football Engine"},{id:"fb-10",gameId:"football",title:"The Fastest Hat-Trick in History",category:"Football Trivia",difficulty:"hard",promptText:"In Premier League history, who scored the fastest hat-trick ever recorded (in just 2 minutes and 56 seconds in 2015)?",revealedAnswer:"Sadio Mané (playing for Southampton against Aston Villa).",explanation:"On May 16, 2015, Sadio Mané netted three goals in 176 seconds, smashing Robbie Fowler’s long-standing record from 1994.",rubric:{criteria:"Exact player name",fullPointsCondition:"Sadio Mané.",partialPointsCondition:"Mentions Southampton or a Liverpool forward without the name.",fullPoints:50},verificationStatus:"Verified Curated AI",source:"Premier League Official Records & Curated AI Dataset"}],zp=[{id:"hq-01",gameId:"heritage",title:"The Weaving of the Bedouin",category:"Traditional Objects",difficulty:"easy",promptText:"I am an ancient UNESCO-inscribed geometric hand-weaving craft practiced by Emirati women using sheep wool and camel hair to craft tents, cushions, and camel saddles. What is my traditional Arabic name?",revealedAnswer:"Al Sadu (السدو)",explanation:"Al Sadu is an authentic Bedouin weaving technique inscribed on UNESCO’s List of Intangible Cultural Heritage. It features striking black, white, and red geometric patterns reflecting desert landscapes.",rubric:{criteria:"Accurate name of the traditional weaving craft",fullPointsCondition:"Al Sadu (or Sadu weaving).",partialPointsCondition:"Mentions Bedouin weaving or carpet weaving.",fullPoints:50},culturalContext:"Traditionally, Emirati women gathered in social groups to spin raw yarn using a drop spindle (Al Maghzal) and weave bold motifs.",verificationStatus:"Verified Curated AI",source:"UNESCO Intangible Cultural Heritage & UAE Ministry of Culture and Youth"},{id:"hq-02",gameId:"heritage",title:"The Architectural Wind Catcher",category:"Landmarks & Architecture",difficulty:"easy",promptText:"Before modern electricity and air conditioning, traditional Gulf homes stayed cool using towering architectural wind towers that funneled cool breezes downward into courtyard rooms. What is this architectural feature called?",revealedAnswer:"Barjeel (البارجيل) / Wind Tower",explanation:"The Barjeel is a signature feature of historical Emirati and Arabian architecture, prominent in historic neighborhoods like Al Fahidi in Dubai and Heart of Sharjah.",rubric:{criteria:"Correct term for the traditional wind tower",fullPointsCondition:"Barjeel (or Barjeel wind tower).",partialPointsCondition:'Says "wind tower" without the Arabic name.',fullPoints:50},culturalContext:"The Barjeel operates through natural convection: the tower catches high-altitude prevailing breezes and directs them down over moist fabric or water pots.",verificationStatus:"Verified Curated AI",source:"Emirati Architectural Heritage Guidelines & Curated AI Heritage Corpus"},{id:"hq-03",gameId:"heritage",title:"The Seafarer’s Celestial Guide",category:"Inventions & Science",difficulty:"medium",promptText:'Nicknamed "The Lion of the Sea" (Asad al-Bahr), which 15th-century Arab navigator and poet born in Julfar (modern-day Ras Al Khaimah) authored the master navigational encyclopedia "Kitab al-Fawa’id"?',revealedAnswer:"Ahmad Ibn Majid (أحمد بن ماجد)",explanation:"Ahmad Ibn Majid was an illustrious Arabian cartographer, astronomer, and navigator whose treatises on lunar mansions, monsoon winds, and compass bearings guided maritime commerce across the Indian Ocean.",rubric:{criteria:"Accurate identification of the historical navigator",fullPointsCondition:"Ahmad Ibn Majid (or Ibn Majid).",partialPointsCondition:'Mentions "Lion of the Sea" or an Arab mariner.',fullPoints:100},culturalContext:"Ras Al Khaimah commemorates Ibn Majid’s legacy as a testament to the UAE’s deep maritime roots and navigational pioneering.",verificationStatus:"Verified Curated AI",source:"UAE National Archives & UNESCO World Heritage Maritime Records"},{id:"hq-04",gameId:"heritage",title:"The Ancient Oasis Waterway",category:"Inventions & Science",difficulty:"medium",promptText:"Dating back over 3,000 years in the historic oases of Al Ain, what is the ancient gravity-fed subterranean irrigation canal system that channels mountain aquifer water to date palm groves?",revealedAnswer:"The Aflaj System (singular: Falaj / فلج)",explanation:"The Falaj irrigation network is an engineering marvel that uses gentle downhill subterranean slopes to distribute water without pumps, recognized as part of Al Ain’s UNESCO World Heritage designation.",rubric:{criteria:"Identification of the Falaj irrigation canal network",fullPointsCondition:"Falaj or Aflaj.",partialPointsCondition:"Mentions oasis water canals without the specific term.",fullPoints:100},culturalContext:"Water distribution via the Falaj was strictly regulated by a community water overseer (Arif) using sundials by day and constellations by night.",verificationStatus:"Verified Curated AI",source:"Al Ain UNESCO World Heritage Documentation & Department of Culture and Tourism Abu Dhabi"},{id:"hq-05",gameId:"heritage",title:"The Fragrant Hospitality Ritual",category:"Customs & Traditions",difficulty:"easy",promptText:"When welcoming guests into a traditional Emirati Majlis, what two aromatic elements are traditionally offered—first brewed with fragrant cardamom and saffron, followed by incense burned over glowing charcoal in a Midkhana?",revealedAnswer:"Gahwa (Arabic Coffee served in Finjan cups) and Bukhoor / Oud (incense burned in a Midkhana).",explanation:"Serving Arabic coffee (Gahwa) with the right hand alongside burning aromatic Bukhoor signifies the pinnacle of Emirati generosity (Karam) and warm hospitality.",rubric:{criteria:"Naming both Arabic coffee and incense/oud",fullPointsCondition:"Gahwa (Arabic coffee) AND Bukhoor / Oud incense.",partialPointsCondition:"Names only coffee or only incense.",fullPoints:50},culturalContext:"Custom dictates that a host holds the Dallah pot in the left hand and presents the small handle-less Finjan cup with the right hand.",verificationStatus:"Verified Curated AI",source:"UNESCO Inscription on Arabic Coffee & UAE Intangible Heritage Records"},{id:"hq-06",gameId:"heritage",title:"The Golden Age House of Wisdom",category:"Inventions & Science",difficulty:"hard",promptText:"During the Islamic Golden Age in the 9th century, which world-renowned grand academy and library in Baghdad brought together global scholars to translate Greek, Persian, and Sanskrit manuscripts into Arabic?",revealedAnswer:"The House of Wisdom (Bayt al-Hikma / بيت الحكمة)",explanation:"Founded under the Abbasid caliphs Harun al-Rashid and Al-Ma’mun, Bayt al-Hikma catalyzed monumental scientific advancements in algebra (Al-Khwarizmi), optics (Ibn al-Haytham), and medicine.",rubric:{criteria:"Historical knowledge of the medieval grand library",fullPointsCondition:"Bayt al-Hikma or House of Wisdom.",partialPointsCondition:"Mentions Baghdad library or Abbasid academy.",fullPoints:150},culturalContext:'In 2020, Sharjah inaugurated its own modern architectural landmark titled "House of Wisdom" to honor this scholarly tradition.',verificationStatus:"Verified Curated AI",source:"Islamic Golden Age Historiography & Sharjah House of Wisdom Archives"},{id:"hq-07",gameId:"heritage",title:"The Falcon’s Sacred Trust",category:"Customs & Traditions",difficulty:"medium",promptText:"Falconry (Al-Bayzara) has been practiced in the Arabian Peninsula for over 4,000 years. What is the traditional soft leather hood placed over a falcon’s eyes to keep the majestic bird calm and focused called?",revealedAnswer:"Al Burqu‘ (البرقع / Falcon Hood)",explanation:"The Burqu‘ is handcrafted by master leatherworkers to fit snugly over the falcon’s head, blocking visual stimuli until the falconer is ready for flight.",rubric:{criteria:"Naming the falcon hood",fullPointsCondition:"Al Burqu‘ (or Burqa / falcon hood).",partialPointsCondition:"Mentions leather hood or falcon mask.",fullPoints:100},culturalContext:"The late Sheikh Zayed bin Sultan Al Nahyan was an internationally celebrated falconer and conservationist who championed sustainable hunting and bird rehabilitation.",verificationStatus:"Verified Curated AI",source:"Abu Dhabi Falcon Hospital & UNESCO Representative List of Falconry"},{id:"hq-08",gameId:"heritage",title:"The Great Pearl Divers’ Season",category:"Traditional Objects",difficulty:"hard",promptText:"During the historical pearl diving era in the Arabian Gulf, what was the primary 4-month summer diving season called when hundreds of wooden dhows set sail together into the open sea?",revealedAnswer:"Al Ghaus Al Kabir (الغوص الكبير / The Grand Dive)",explanation:"Al Ghaus Al Kabir ran from June through September when sea waters were warm and visibility was clearest. Divers relied on a nose clip (Fattam) and diving stone (Hasah) to descend to the sea floor.",rubric:{criteria:"Naming the grand pearl diving season",fullPointsCondition:"Al Ghaus Al Kabir (or Al Ghaus / The Grand Dive).",partialPointsCondition:"Mentions summer pearl season.",fullPoints:150},culturalContext:"Onboard the pearling dhow, the Nahham (ship singer) sang rhythmic seafaring chants to sustain crew morale during grueling diving shifts.",verificationStatus:"Verified Curated AI",source:"UAE Maritime Heritage Center & Pearling Oral History Project"},{id:"hq-09",gameId:"heritage",title:"Global Wonders: The Rose-Red Rock City",category:"Landmarks & Architecture",difficulty:"easy",promptText:"Carved directly into vibrant red sandstone cliffs by the ancient Nabataeans over 2,000 years ago, which UNESCO World Heritage wonder is accessed through a narrow canyon gorge known as the Siq?",revealedAnswer:"Petra (Jordan) / Al-Batra",explanation:"Petra was the thriving commercial capital of the Nabataean kingdom, celebrated worldwide for its Treasury (Al-Khazneh) and sophisticated water collection conduits.",rubric:{criteria:"Accurate identification of Petra",fullPointsCondition:"Petra.",partialPointsCondition:"Mentions Jordan or Nabataean city without the name.",fullPoints:50},verificationStatus:"Verified Curated AI",source:"UNESCO World Heritage Centre & Global Cultural Heritage Archives"},{id:"hq-10",gameId:"heritage",title:"The Palm Frond Craft",category:"Traditional Objects",difficulty:"medium",promptText:"What is the traditional Emirati craft of weaving dried date palm fronds into practical household items such as food covers (Sarroud), mats (Haseer), and hand fans (Mehffa)?",revealedAnswer:"Al Khous (الخوص)",explanation:"Al Khous is an essential sustainable heritage craft demonstrating how Emirati ancestors utilized every single component of the blessed date palm tree.",rubric:{criteria:"Naming the palm frond weaving craft",fullPointsCondition:"Al Khous (or Khous).",partialPointsCondition:"Mentions palm weaving.",fullPoints:100},culturalContext:"Palm leaves were soaked in water to soften them, then dried in the shade and dyed with natural pigments before braiding.",verificationStatus:"Verified Curated AI",source:"UAE Heritage Crafts Registry & Intangible Cultural Heritage"}],Lp=[{id:"dd-01",gameId:"desert",title:"The Stargazer’s Lost Caravan Route",category:"Celestial Navigation",difficulty:"medium",promptText:"Your youth expedition caravan is crossing the fictional Crimson Sands to reach the Annual Astronomy Camp. At dusk, your digital handheld GPS loses satellite sync. The wind has smoothed over all previous tire and foot tracks. Your team must reach the camp by sunrise.",options:[{id:"opt-a",text:"A) Climb the tallest nearby dune crest, identify the North Star (Polaris) using the Big Dipper pointer stars, and march in a steady northerly bearing.",points:100,feedback:"OPTIMAL! Ancient Bedouin celestial navigation uses Polaris because it remains stationary in the northern sky, guaranteeing a true directional heading without electronics.",tier:"optimal"},{id:"opt-b",text:"B) Sprint as fast as possible in the direction you think the camp lies before full darkness sets in.",points:20,feedback:"POOR. Running blindly in soft sand causes rapid exhaustion, dehydration, and high risk of disorientation in the dark.",tier:"poor"},{id:"opt-c",text:"C) Pitch your thermal shelter immediately, build a reflective stone marker, and wait for daylight while monitoring wind patterns.",points:70,feedback:"GOOD ALTERNATIVE. Very safe and prevents getting lost, though you might miss the dawn opening ceremony of the astronomy camp.",tier:"good"},{id:"opt-d",text:"D) Split your 4 team members into pairs and walk in two opposite directions to double your chances of finding a landmark.",points:10,feedback:"HAZARDOUS. Never split the team in wide wilderness areas—this splits your water supplies and safety communication.",tier:"poor"}],revealedAnswer:"Option A: Orient using Polaris and maintain steady unified team navigation.",explanation:"Polaris provides a constant northern benchmark. In the desert night, temperatures cool down significantly, making night trekking efficient if guided by fixed celestial markers.",rubric:{criteria:"Team cohesion, celestial orientation, resource and stamina conservation",fullPointsCondition:"Team selects Option A: identifies star navigation and keeps the group together.",partialPointsCondition:"Team selects Option C (shelter in place safe play: 70 pts).",fullPoints:100},verificationStatus:"Verified Curated AI",source:"Fictional Adventure Logic & AI Desert Strategy Engine"},{id:"dd-02",gameId:"desert",title:"The Shifting Sandstorm Alert",category:"Weather Preparedness",difficulty:"easy",promptText:"While documenting ancient petroglyphs near the base of a jagged sandstone ridge, your portable barometer drops sharply and a reddish dust haze appears on the southern horizon. A Shamal sandstorm will strike in approximately 15 minutes. What is your strategy?",options:[{id:"opt-a",text:"A) Take shelter on the leeward (sheltered downwind) side of the rocky ridge, secure goggles and scarves around your mouth, link backpacks together, and sit close in a huddle.",points:100,feedback:"OPTIMAL! Natural rock outcrops break the force of the wind, protective face coverings prevent dust inhalation, and huddling keeps equipment secure.",tier:"optimal"},{id:"opt-b",text:"B) Stand at the top peak of the ridge with flashlights turned on high to wave for help.",points:15,feedback:"DANGEROUS. Ridge peaks experience the highest violent gusts and flying sand particles, with high risk of slipping.",tier:"poor"},{id:"opt-c",text:"C) Try to outrun the storm in your dune buggy back to the main base 30 miles away.",points:35,feedback:"HIGH RISK. Driving in zero-visibility sandstorms leads to vehicular accidents and getting trapped in shifting sandbanks.",tier:"risky"},{id:"opt-d",text:"D) Find a dry riverbed (Wadi canyon floor) and dig a trench to lie down in.",points:40,feedback:"RISKY. While sheltered from wind, low wadi channels in desert storms can experience unexpected flash runoff or falling debris.",tier:"risky"}],revealedAnswer:"Option A: Leeward rock shelter, eye/mouth protection, and group huddle.",explanation:"Sandstorms are temporary but fierce. Staying low on the sheltered side of durable rock formations preserves gear, vision, and team safety.",rubric:{criteria:"Immediate hazard mitigation, avoiding high peaks and zero-visibility driving",fullPointsCondition:"Team selects Option A (+100 pts).",partialPointsCondition:"Team selects Option D or C (+35-40 pts).",fullPoints:100},verificationStatus:"Verified Curated AI",source:"Fictional Adventure Logic & AI Desert Strategy Engine"},{id:"dd-03",gameId:"desert",title:"The Solar Beacon Battery Crisis",category:"Resource Management",difficulty:"hard",promptText:"Your team is conducting environmental wildlife research in the desert sanctuary. Your primary communication transmitter battery is at 18%. You also have a portable solar charging blanket, two extra liters of emergency water, and must transmit your research findings by 4:00 PM (3 hours away) during peak noon sun.",options:[{id:"opt-a",text:"A) Angle the solar blanket with a 5-inch air gap beneath it for cooling, turn the transmitter off completely to charge faster, and transmit in one efficient 3-minute burst at 3:55 PM.",points:100,feedback:"OPTIMAL! Solar panels lose efficiency if overheated on hot sand; elevating them creates airflow. Turning off the device eliminates parasitic load during charging.",tier:"optimal"},{id:"opt-b",text:"B) Leave the transmitter on and livestream continuous video while it charges on the sand.",points:10,feedback:"BLUNDER. Continuous streaming drains battery faster than standard solar inputs and risks thermal shutdown under direct midday heat.",tier:"poor"},{id:"opt-c",text:"C) Pour some of your drinking water over the solar blanket and battery to keep them ice-cold.",points:15,feedback:"TERRIBLE. Never waste drinking water on electronic cooling, and water can short circuit sensitive connections.",tier:"poor"},{id:"opt-d",text:"D) Send two team members on foot with the transmitter to hike to the nearest road.",points:30,feedback:"SUBOPTIMAL. Hiking in the scorching noon sun needlessly exposes members to heat stress when solar charging is already available.",tier:"risky"}],revealedAnswer:"Option A: Maximize solar efficiency with cooling air-gap and batch transmit.",explanation:"Electronics operate better with airflow, and batch data transmission conserves vital battery power while keeping the team safely rested.",rubric:{criteria:"Energy efficiency, heat management, and zero waste of drinking water",fullPointsCondition:"Team chooses Option A (+100 pts).",partialPointsCondition:"Team recognizes batch transmission but forgets heat ventilation.",fullPoints:100},verificationStatus:"Verified Curated AI",source:"STEM Clean Energy Scenarios & AI Desert Strategy Engine"},{id:"dd-04",gameId:"desert",title:"The Mirage on the Salt Flat (Sabkha)",category:"Critical Thinking",difficulty:"medium",promptText:"During a midday crossing of a shimmering coastal salt flat (Sabkha), your teammate excitedly points 800 meters ahead, swearing they see a fresh freshwater pond with waving palm trees. The thermometer reads 42°C. What is your team’s assessment?",options:[{id:"opt-a",text:"A) Recognize it as an inferior mirage (refraction caused by hot air layers bending light rays from the sky), recheck the topographical map, and stick strictly to the established hard-packed route.",points:100,feedback:"OPTIMAL! Inferior mirages occur when ground heat bends skylight upward, mimicking water. Sabkha crusts can break underfoot if you stray into muddy subsurface brine.",tier:"optimal"},{id:"opt-b",text:"B) Drop packs and sprint over with canteens to refill before the water evaporates.",points:15,feedback:"POOR. Chasing mirages leads straight into unstable salt mud and wastes critical physical hydration.",tier:"poor"},{id:"opt-c",text:"C) Use binoculars to verify if birds or vegetation are present; if not confirmed, proceed on the marked route.",points:75,feedback:"VERY GOOD. Using optical verification and staying on the surveyed track shows sensible scientific scrutiny.",tier:"good"},{id:"opt-d",text:"D) Dig a 1-meter hole right where you stand to see if the groundwater is near.",points:30,feedback:"SUBOPTIMAL. Digging in Sabkha produces saline brine, not fresh drinking water, and expends precious physical energy.",tier:"risky"}],revealedAnswer:"Option A or C: Identify the atmospheric optical refraction (mirage) and stay on the firm route.",explanation:"Atmospheric physics explains how extreme ground heat bends light. Coastal Sabkhas have deceptive crusts that hide deep sticky mud beneath.",rubric:{criteria:"Understanding optical mirages and maintaining route safety on salt flats",fullPointsCondition:"Chooses Option A (+100 pts) or Option C (+75 pts).",partialPointsCondition:"Identifies mirage but attempts digging.",fullPoints:100},verificationStatus:"Verified Curated AI",source:"Atmospheric Physics & Desert Field Science Scenarios"},{id:"dd-05",gameId:"desert",title:"The Camel Herd Right-of-Way",category:"Wildlife & Cultural Etiquette",difficulty:"easy",promptText:"Your expedition vehicle approaches a narrow gap between two dunes where a local herder is guiding a prized herd of 15 desert camels across the sand track. The herder has not noticed your vehicle yet. How do you proceed?",options:[{id:"opt-a",text:"A) Stop the vehicle at a respectful distance (at least 40 meters away), turn off loud engines, wait patiently until the herd has fully crossed, and exchange a friendly wave with the herder.",points:100,feedback:"OPTIMAL! Demonstrates respectful desert etiquette, prevents startling valuable camels, and maintains harmonious community relations.",tier:"optimal"},{id:"opt-b",text:"B) Honk the horn repeatedly to alert the herder to hurry up.",points:10,feedback:"DISRESPECTFUL. Honking frightens camels, causing panic, injury, or scattering across steep dunes.",tier:"poor"},{id:"opt-c",text:"C) Try to accelerate quickly around the edge of the herd along the steep dune crest.",points:25,feedback:"RECKLESS. Cutting off a herd on a steep dune slope risks vehicle rollover and endangers the animals.",tier:"risky"},{id:"opt-d",text:"D) Step out of the vehicle and attempt to herd the camels yourself with waving arms.",points:20,feedback:"UNSAFE. Camels are large and protective of calves; untrained strangers should never attempt to interfere.",tier:"poor"}],revealedAnswer:"Option A: Stop at a safe distance, silence engine, and wait patiently for the herd.",explanation:"Camels (Al Ibil) hold deep cultural and economic reverence in Arabian culture. Courteous patience is the golden rule of desert travel.",rubric:{criteria:"Respect for animals, cultural etiquette, vehicle safety",fullPointsCondition:"Option A (+100 pts).",partialPointsCondition:"None.",fullPoints:100},culturalContext:"In Bedouin tradition, travelers always yield unconditional right-of-way to livestock and pastoralists.",verificationStatus:"Verified Curated AI",source:"Emirati Desert Code of Conduct & Curated AI Ethics Library"},{id:"dd-06",gameId:"desert",title:"The Ghaf Tree Sanctuary",category:"Ecology & Flora",difficulty:"medium",promptText:"Your team is setting up an ecological field station during a hot afternoon. You spot a grove of evergreen Ghaf trees (*Prosopis cineraria*). Why is setting your temporary rest camp under the Ghaf tree grove the best ecological decision?",options:[{id:"opt-a",text:"A) The Ghaf tree provides natural dense cooling canopy shade, its deep taproots stabilize the ground, and it creates a vibrant microclimate 5–8°C cooler than open sand without damaging vegetation.",points:100,feedback:"OPTIMAL! The Ghaf is the national tree of the UAE, renowned for deep taproots (reaching up to 30 meters to aquifers) and providing vital shelter for biodiversity.",tier:"optimal"},{id:"opt-b",text:"B) You can chop down several branches of the Ghaf tree to construct a wooden fortress.",points:10,feedback:"ILLEGAL & DESTRUCTIVE. In the UAE, Ghaf trees are strictly protected by federal environmental conservation laws; damaging them is prohibited.",tier:"poor"},{id:"opt-c",text:"C) The tree attracts toxic insects, so you should avoid it and camp in the open blazing sun.",points:20,feedback:"FALSE. The Ghaf is a harmless keystone species and camping in the blazing sun invites severe heat exhaustion.",tier:"poor"},{id:"opt-d",text:"D) Park your heavy vehicle directly over the exposed roots of the tree.",points:35,feedback:"HARMFUL. Parking heavy vehicles on root systems compacts soil and damages shallow feeder roots.",tier:"risky"}],revealedAnswer:"Option A: Utilize the natural cooling canopy while preserving the protected tree.",explanation:"The Ghaf tree was designated the symbol for the UAE Year of Tolerance because of its role as an enduring sanctuary for travelers and nature.",rubric:{criteria:"Knowledge of UAE national tree, environmental protection, natural cooling",fullPointsCondition:"Option A (+100 pts).",partialPointsCondition:"Recognizes shade benefits but unaware of conservation laws.",fullPoints:100},verificationStatus:"Verified Curated AI",source:"UAE Ministry of Climate Change & Environment Protected Species List"}],_p=[{id:"fd-01",gameId:"food",title:"The Golden Spiced Feast",category:"Celebration Feasts",difficulty:"easy",promptText:"I am the majestic centerpiece of festive Emirati banquets and celebratory family gatherings. Long grains of basmati rice are slow-cooked in a fragrant broth infused with dried black lime (Loomi), cardamom, cinnamon, saffron, and tender meat.",clues:["Clue 1: My signature tangy-earthy flavor comes from sun-dried black limes (Loomi).","Clue 2: I am colored with golden saffron and served on large communal platters called Siniya.",'Clue 3: My name stems from the Arabic root meaning "compacted" or "pressed together".'],revealedAnswer:"Machboos (مجبوس) / Kabsa",explanation:"Machboos is the quintessential celebratory rice dish of the UAE and Gulf region. The harmonious blend of Bezar spice mix, Loomi, and slow-braised meats represents the heart of Gulf culinary hospitality.",rubric:{criteria:"Identifying the national celebratory spiced rice dish",fullPointsCondition:"Machboos (or Majboos / Kabsa).",partialPointsCondition:'Mentions "spiced rice with meat".',fullPoints:120},culturalContext:"Traditionally served on large platters where family members gather and eat together, reflecting the Emirati tradition of shared blessings.",verificationStatus:"Verified Curated AI",source:"Emirati Culinary Heritage Association & Traditional Recipe Registry"},{id:"fd-02",gameId:"food",title:"The Wholesome Ramadan Comfort",category:"Festive Traditions",difficulty:"medium",promptText:"I am a revered traditional dish dating back centuries, especially cherished during the holy month of Ramadan and wedding banquets. Cracked wheat and shredded meat are slow-cooked for hours, then vigorously beaten with a wooden paddle into a silky, savory porridge drizzled with golden ghee.",clues:["Clue 1: My preparation requires hours of stirring with a heavy wooden paddle called Al Meswat.","Clue 2: I consist primarily of coarse wheat grains (Huboob) and meat or chicken melded until completely smooth.","Clue 3: In 2023, UNESCO inscribed me onto the Representative List of Intangible Cultural Heritage of Humanity!"],revealedAnswer:"Al Harees (الهريس)",explanation:"Al Harees is one of the oldest dishes in the Middle East, praised for its rich nourishment and communal preparation during Ramadan when big pots are cooked over wood embers and distributed to neighbors.",rubric:{criteria:"Naming the traditional pounded wheat porridge",fullPointsCondition:"Harees (or Al Harees).",partialPointsCondition:'Describes "wheat and meat porridge".',fullPoints:120},culturalContext:"In December 2023, UNESCO officially inscribed Harees as an Intangible Cultural Heritage item shared by the UAE, Saudi Arabia, and Oman.",verificationStatus:"Verified Curated AI",source:"UNESCO Intangible Cultural Heritage Registry 2023 & UAE Ministry of Culture"},{id:"fd-03",gameId:"food",title:"The Golden Crisp Dumplings of Joy",category:"Desserts & Celebrations",difficulty:"easy",promptText:"Golden-brown, feather-light, and crispy on the outside with a soft fluffy interior, I am bite-sized fried dough spheres perfumed with cardamom and saffron, drizzled generously with thick date syrup (Dibs) and sprinkled with toasted sesame seeds.",clues:['Clue 1: My name comes from the Arabic word for "morsels" or "little bites".',"Clue 2: I am famously drenched in dark date syrup (Dibs) or honey.","Clue 3: I am the most popular sweet served at Emirati cultural festivals and family celebrations."],revealedAnswer:"Luqaimat (لقيمات)",explanation:"Luqaimat is the undisputed favorite dessert in Emirati culture. Freshly fried and served hot, the contrast between crunchy crust and sweet date syrup is an iconic family delight.",rubric:{criteria:"Naming the fried dough sweet drizzled with date syrup",fullPointsCondition:"Luqaimat (or Legemat).",partialPointsCondition:'Says "sweet dumplings".',fullPoints:120},culturalContext:"Mastering the technique of squeezing the batter between the thumb and forefinger to drop perfect spheres into hot oil is considered a treasured culinary skill passed down through generations.",verificationStatus:"Verified Curated AI",source:"Traditional Emirati Sweets Archive & Curated AI Gastronomy Database"},{id:"fd-04",gameId:"food",title:"The Thousand-Layer Honey Pastry",category:"World Cultural Feasts",difficulty:"easy",promptText:"Celebrated across Levantine, Mediterranean, and Central Asian festivities, I feature micro-thin layers of filo dough brushed with butter, packed with crushed pistachios or walnuts, and drenched in fragrant orange blossom or rosewater syrup.",clues:["Clue 1: My pastry sheets are tissue-thin filo dough stacked into dozens of crisp layers.","Clue 2: I am filled with crushed emerald pistachios or fragrant walnuts.","Clue 3: I am cut into diamond shapes and bathed in fragrant sugar syrup or wild honey."],revealedAnswer:"Baklava (بقلاوة)",explanation:"Baklava is a masterpiece of confectionary craft whose origins trace through Ottoman and Mediterranean banquet halls, today enjoyed worldwide during festive holidays and Eid gatherings.",rubric:{criteria:"Identifying Baklava",fullPointsCondition:"Baklava (or Baklawa).",partialPointsCondition:"Mentions pistachio filo pastry.",fullPoints:120},culturalContext:"Making genuine handcrafted baklava requires incredible finesse to roll translucent sheets of pastry that puff into delicate golden layers when baked.",verificationStatus:"Verified Curated AI",source:"Mediterranean & Middle Eastern Gastronomy Encyclopedia"},{id:"fd-05",gameId:"food",title:"The Egyptian Royal Warm Pudding",category:"World Cultural Feasts",difficulty:"medium",promptText:"Served piping hot in clay dishes with a golden broiled crust, I am a comforting dessert made of toasted puff pastry soaked in hot sweetened milk, heavy cream, raisins, toasted almonds, coconut flakes, and cinnamon.",clues:['Clue 1: My name translates to "Mother of Ali".',"Clue 2: I am Egypt’s beloved national dessert, renowned throughout the Arab world.","Clue 3: I am baked in the oven until the creamy top turns golden brown and bubbly."],revealedAnswer:"Umm Ali (أم علي)",explanation:"Umm Ali is an iconic warm Egyptian bread pudding dessert dating back to the 13th century Ayyubid and Mamluk periods, renowned for its rich milky sweetness and crunchy roasted nuts.",rubric:{criteria:"Naming the Egyptian bread-pudding dessert",fullPointsCondition:"Umm Ali (or Om Ali).",partialPointsCondition:'Says "Egyptian bread pudding".',fullPoints:120},verificationStatus:"Verified Curated AI",source:"Egyptian Culinary Heritage & MENA Gastronomy Records"},{id:"fd-06",gameId:"food",title:"The Fragrant Morning Flatbread",category:"Breakfast & Heritage",difficulty:"medium",promptText:"Cooked on a convex circular iron griddle called a Tawa, I am an ultra-thin, crisp Emirati crepe-like bread often folded with egg, spread with Kraft cheese, drizzled with honey, or dusted with crushed Regag chips.",clues:['Clue 1: My name comes from the Arabic word for "thin" or "delicate" (Raqeeq).',"Clue 2: I am scraped across a smoking-hot convex pan until wafer-crisp.","Clue 3: When broken into pieces, I form the foundational base for the savory meat stew dish called Threed."],revealedAnswer:"Khubz Regag (خبز رقاق)",explanation:"Khubz Regag is a timeless staple of Emirati breakfast and iftar tables. When layered with savory lamb and vegetable stew, it forms Threed, famously beloved since ancient times.",rubric:{criteria:"Naming the wafer-thin bread",fullPointsCondition:"Khubz Regag (or Regag bread / Rqaq).",partialPointsCondition:"Names Threed or says Emirati thin bread.",fullPoints:120},culturalContext:"Watching an Emirati baker dexterously sweep a ball of soft dough across the red-hot Tawa griddle with bare hands is a highlight of cultural heritage villages.",verificationStatus:"Verified Curated AI",source:"Emirati Traditional Food Guide & Curated AI Gastronomy Database"},{id:"fd-07",gameId:"food",title:"The Sweet Saffron Vermicelli & Egg",category:"Breakfast & Celebrations",difficulty:"hard",promptText:"I am a unique sweet-and-savory Emirati breakfast specialty traditionally served on Eid mornings. Sweet golden vermicelli noodles infused with rosewater, saffron, and cardamom are topped with a savory plain egg omelet.",clues:["Clue 1: I balance sweet spiced noodles against a savory fried egg omelet.","Clue 2: My golden strands are sweetened with sugar and yellowed with saffron threads.",'Clue 3: My Arabic name begins with the letter "B".'],revealedAnswer:"Balaleet (بلاليط)",explanation:"Balaleet is a beloved traditional dish presenting a masterclass in flavor contrast: sweetened, spiced vermicelli noodles crowned with a savory, lightly salted egg omelet.",rubric:{criteria:"Naming the sweet vermicelli breakfast dish",fullPointsCondition:"Balaleet.",partialPointsCondition:'Describes "sweet vermicelli with egg".',fullPoints:120},culturalContext:"A signature dish served early on the morning of Eid Al Fitr after Eid prayers, welcoming relatives and guests.",verificationStatus:"Verified Curated AI",source:"Gulf Culinary Heritage Encyclopedia & National Traditions Archive"},{id:"fd-08",gameId:"food",title:"The Andean Golden Super-Grain",category:"World Cultural Feasts",difficulty:"easy",promptText:'Cultivated in the Andes Mountains of South America for over 5,000 years and revered by the ancient Incas as the "Mother Grain" (Chisaya Mama), I am a gluten-free pseudo-cereal high in complete protein.',clues:['Clue 1: The Incas called me the "Mother of all Grains".',"Clue 2: When cooked, my tiny seeds pop open to reveal a spiral germ ring.","Clue 3: The United Nations declared 2013 as my international year."],revealedAnswer:"Quinoa (كينوا)",explanation:"Quinoa was domesticated in the Lake Titicaca basin by pre-Columbian civilizations. Because it contains all nine essential amino acids, it has become a global nutrition powerhouse.",rubric:{criteria:"Identifying Quinoa",fullPointsCondition:"Quinoa.",partialPointsCondition:"Names South American grain.",fullPoints:120},verificationStatus:"Verified Curated AI",source:"UN FAO International Year of Quinoa Archives & Global Food History"}],Op=[{id:"ss-01",gameId:"sports",title:"The 4.2-Second Buzzer Beater (Basketball)",category:"Basketball Tactics",difficulty:"medium",promptText:"Your team is trailing by 1 point (88–89) with 4.2 seconds remaining on the clock. You have possession of the ball inbounding from the frontcourt sideline. The opposing defense is playing tight man-to-man coverage, heavily denying the perimeter. What inbound play gives you the highest mathematical probability of winning?",options:[{id:"opt-a",text:'A) Execute an "Elevator Screen" door-close action at the top of the key for your 41% three-point shooter, with a weakside backdoor lob cutter as an immediate decoy.',points:100,feedback:"TACTICAL MASTERCLASS! The elevator screen traps the trailing defender between two closing screeners. Even if contested, shooting for the 3 wins outright or draws a foul, while the backdoor cut prevents defensive hedging.",tier:"optimal"},{id:"opt-b",text:"B) Inbound a high prayer lob directly toward the rim into a crowded pack of 4 defenders.",points:15,feedback:"BLUNDER. Lobbing into heavy traffic without an established seal or size mismatch results in an intercepted pass and clock expiration.",tier:"poor"},{id:"opt-c",text:"C) Inbound to the nearest guard 35 feet from the basket and have them attempt an unassisted off-dribble step-back contested jumper.",points:35,feedback:"LOW PERCENTAGE. 4.2 seconds is enough time for a designed pass-and-screen; settling for a contested 35-foot isolation is inefficient.",tier:"risky"},{id:"opt-d",text:"D) Run a quick baseline curl to feed your center for a 5-foot turnaround hook shot.",points:75,feedback:"SOLID PLAY. Since you only trail by 1, a high-percentage paint touch wins the game cleanly without needing a 3-pointer.",tier:"good"}],revealedAnswer:"Option A (or Option D): Designed screening play to free a high-percentage look rather than an off-balance heave.",explanation:"With 4.2 seconds, you can execute at least one crisp screening sequence. When trailing by 1, either a designed elevator screen or an interior high-percentage paint curl is superior to an isolation heave.",rubric:{criteria:"Clock management, screen execution, high-percentage shot selection",fullPointsCondition:"Team selects Option A (100 pts) or Option D (75 pts).",partialPointsCondition:"Team selects Option C (35 pts).",fullPoints:100},verificationStatus:"Verified Curated AI",source:"Advanced Basketball Analytics & AI Sports Strategy Engine"},{id:"ss-02",gameId:"sports",title:"The Break Point Defense (Tennis)",category:"Tennis Tactics",difficulty:"hard",promptText:"In the deciding set at 4–4, 30–40 (facing break point), your opponent has punished your second serves all afternoon with heavy topspin cross-court forehands into your weaker backhand corner. You miss your first serve. How do you construct this high-stakes second serve point?",options:[{id:"opt-a",text:'A) Hit a sharp slice or heavy kick serve directed straight "into the opponent’s body" (jamming the hip/ribcage), preventing them from extending their arms for a cross-court angle, then anticipate their floated return with an aggressive forward forehand.',points:100,feedback:"TACTICAL MASTERCLASS! The body serve strips the returner of their wingspan and takes away angular leverage, forcing a defensive central return.",tier:"optimal"},{id:"opt-b",text:"B) Go for a reckless 125 mph flat second serve aiming for the outermost chalk line.",points:20,feedback:"RECKLESS. The double-fault probability on a maximum-risk flat second serve at break point is over 60%.",tier:"poor"},{id:"opt-c",text:"C) Hit a gentle underarm serve to surprise them.",points:25,feedback:"GIMMICK. If an aggressive returner is stepping inside the baseline, a slow underarm serve gives them an easy put-away winner.",tier:"poor"},{id:"opt-d",text:"D) Serve wide to their forehand and retreat 4 meters behind the baseline to play defense.",points:50,feedback:"MEDIOCRE. Giving their lethal forehand the entire open court while retreating concedes total control of the rally.",tier:"risky"}],revealedAnswer:"Option A: Jamming body serve to eliminate return angles and gain offensive court positioning.",explanation:"Elite tennis players use body serves under pressure because even a great ball-striker cannot generate extreme angles when cramped for space.",rubric:{criteria:"Targeting body mechanics, risk mitigation, second-serve margin of error",fullPointsCondition:"Option A (+100 pts).",partialPointsCondition:"Option D (+50 pts).",fullPoints:100},verificationStatus:"Verified Curated AI",source:"Grand Slam Tactical Matchplay Analysis & AI Sports Strategy Engine"},{id:"ss-03",gameId:"sports",title:"Final Over Defense (Cricket T20)",category:"Cricket Tactics",difficulty:"medium",promptText:"Your team is defending 11 runs off the final 6 deliveries in a thrilling championship final. The opposing team has two powerful hitters at the crease, and the boundary on the leg side is relatively short (58 meters). What bowling strategy minimizes run scoring?",options:[{id:"opt-a",text:"A) Bowl wide-line yorkers just inside the off-side tramline with a deep point, deep cover, and long-off boundary ring, forcing the batter to hit through the longer off-side boundary against defensive fields.",points:100,feedback:"TACTICAL MASTERCLASS! Wide yorkers prevent the batter from accessing their favored short leg-side swing and severely limit elevation leverage.",tier:"optimal"},{id:"opt-b",text:"B) Bowl short-pitched bouncers directly onto middle stump delivery after delivery.",points:25,feedback:"POOR. Short balls on middle stump sit up perfectly for power pull shots over the short 58m leg-side boundary.",tier:"poor"},{id:"opt-c",text:"C) Bowl gentle slow-medium full tosses right down the center of the pitch.",points:10,feedback:"DISASTER. Full tosses at death overs are routinely dispatched for sixes.",tier:"poor"},{id:"opt-d",text:"D) Mix between slower back-of-the-hand cutters and straight yorkers on off-stump.",points:75,feedback:"SOLID ALTERNATIVE. Variation in pace disrupts timing, though an accidental miss in length carries risk.",tier:"good"}],revealedAnswer:"Option A (or Option D): Wide yorker strategy taking away the short leg-side boundary.",explanation:"Tactical death bowling is governed by boundary dimensions. Funneling hits toward the longer boundary with pinpoint wide yorkers is the gold standard.",rubric:{criteria:"Boundary dimension exploitation, delivery execution, denying bat swing arcs",fullPointsCondition:"Option A (+100 pts) or Option D (+75 pts).",partialPointsCondition:"Option B (+25 pts).",fullPoints:100},verificationStatus:"Verified Curated AI",source:"T20 Cricket Analytics & Curated AI Sports Strategy Engine"},{id:"ss-04",gameId:"sports",title:"The 4x400m Relay Baton Handover (Athletics)",category:"Track & Field Tactics",difficulty:"easy",promptText:"Your relay team is entering the final baton exchange of the 4x400m relay in 2nd place, 3 meters behind the leader. What is the fundamental tactical rule for the outgoing anchor runner during the exchange zone?",options:[{id:"opt-a",text:"A) Match the incoming runner’s acceleration smoothly inside the 20m acceleration zone, receive the baton with your left hand without looking back, and protect the inside rail curb as you transition into full stride.",points:100,feedback:"OPTIMAL! A blind, confident handover with matching sprint speed preserves velocity through the exchange without decelerating.",tier:"optimal"},{id:"opt-b",text:"B) Stand completely still at the exchange line and wait until the tired runner puts the baton into your hand.",points:15,feedback:"DISASTER. Starting from a dead stop costs over 1.5 seconds of momentum and allows opponents to blow past you.",tier:"poor"},{id:"opt-c",text:"C) Turn your head around 180 degrees and jog backward while waving your hands.",points:20,feedback:"DANGEROUS. Running backward causes baton drops, lane infringements, and collisions.",tier:"poor"},{id:"opt-d",text:"D) Sprint at 100% velocity before the incoming runner even crosses the check-mark, running right out of the exchange zone.",points:10,feedback:"DISQUALIFICATION. Exiting the exchange zone before receiving the baton results in an automatic red flag and team disqualification.",tier:"poor"}],revealedAnswer:"Option A: Accelerated smooth handover inside the designated zone preserving momentum.",explanation:"Relays are won on the efficiency of the exchange zone. Preserving kinetic velocity without over-running the 20-meter zone is the key.",rubric:{criteria:"Knowledge of relay exchange zones, acceleration matching, legal rules",fullPointsCondition:"Option A (+100 pts).",p
